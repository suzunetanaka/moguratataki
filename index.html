<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>もぐらたたき</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("mogura", {
        init: function () {
          this.el.innerHTML = `
            <a-cylinder class="mole-body" radius="0.5" height="1.0" color="#A66A3F"></a-cylinder>
            <a-sphere class="mole-body" position="0 0.5 0" radius="0.5" color="#A66A3F"></a-sphere>
            <a-sphere class="mole-eye left-eye" position="-0.2 0.5 0.45" radius="0.07" color="black"></a-sphere>
            <a-sphere class="mole-eye right-eye" position="0.2 0.5 0.45" radius="0.07" color="black"></a-sphere>
            <a-sphere position="0 0.35 0.5" radius="0.09" color="#f6a4b5"></a-sphere>

            <a-entity class="hit-eye hit-eye-left" visible="false">
              <a-box position="-0.2 0.5 0.47" width="0.04" height="0.22" depth="0.02" rotation="0 0 45" color="black"></a-box>
              <a-box position="-0.2 0.5 0.47" width="0.04" height="0.22" depth="0.02" rotation="0 0 -45" color="black"></a-box>
            </a-entity>
            <a-entity class="hit-eye hit-eye-right" visible="false">
              <a-box position="0.2 0.5 0.47" width="0.04" height="0.22" depth="0.02" rotation="0 0 45" color="black"></a-box>
              <a-box position="0.2 0.5 0.47" width="0.04" height="0.22" depth="0.02" rotation="0 0 -45" color="black"></a-box>
            </a-entity>
            <a-sphere class="mole-nose" position="0 0.35 0.5" radius="0.09" color="#f6a4b5"></a-sphere>
          `;
        },
      });

      // 雲
      AFRAME.registerComponent("cloud", {
        schema: {
          speed: { default: 0.6 }, //流れる速さ(単位/秒)
          limit: { default: 70 }, //この X を超えたら反対側へ戻す
        },
        init: function () {
          //[x, y, z, 半径] ふくらみの配置
          const puffs = [
            [0, 0, 0, 2.2],
            [2.1, -0.2, 0.2, 1.7],
            [-2.1, -0.3, 0, 1.6],
            [1.0, 0.9, 0, 1.5],
            [-0.9, 0.8, 0.1, 1.4],
            [3.5, -0.5, 0, 1.1],
            [-3.4, -0.5, 0, 1.0],
          ];
          puffs.forEach(([x, y, z, r]) => {
            const jitter = 0.85 + Math.random() * 0.3; 
            const puff = document.createElement("a-sphere");
            puff.setAttribute("radius", (r * jitter).toFixed(2));
            puff.setAttribute("segments-width", 16);
            puff.setAttribute("segments-height", 12);
            puff.setAttribute("scale", "1 0.7 0.8"); 
            puff.setAttribute("position", `${x} ${y} ${z}`);
            puff.setAttribute(
              "material",
              "shader: flat; color: #ffffff; opacity: 0.95; transparent: true",
            );
            this.el.appendChild(puff);
          });
        },
        tick: function (time, delta) {
          const pos = this.el.object3D.position;
          pos.x += (this.data.speed * delta) / 1000;
          if (pos.x > this.data.limit) {
            pos.x = -this.data.limit;
          }
        },
      });

      //花（仮）
      AFRAME.registerComponent("flower", {
        schema: {
          color: { default: "#ffffff" }, //花びらの色
          size: { default: 2.2 }, //花の大きさ
        },
        init: function () {
          let petals = "";
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const px = (Math.cos(angle) * 0.09).toFixed(3);
            const pz = (Math.sin(angle) * 0.09).toFixed(3);
            petals += `<a-sphere position="${px} 0.25 ${pz}" radius="0.06" color="${this.data.color}"></a-sphere>`;
          }

          this.el.innerHTML = `
            <a-cylinder position="0 0.125 0" radius="0.01" height="0.25" color="#2e7d32"></a-cylinder>
            ${petals}
            <a-sphere position="0 0.25 0" radius="0.05" color="#ffeb3b"></a-sphere>
          `;

          const s = this.data.size;
          this.el.setAttribute("scale", `${s} ${s} ${s}`);
        },
      });
    </script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 100">
      <a-entity
        id="ctlR"
        laser-controls="hand: right"
        raycaster="lineColor: red; objects: .clickable; far: 100"
      ></a-entity>
      <a-entity
        id="ctlL"
        laser-controls="hand: left"
        raycaster="lineColor: yellow; objects: .clickable; far: 100"
      ></a-entity>

      <!--<a-sky color="#87CEEB"></a-sky>-->
      <a-sky color="#76BDEB"></a-sky>
      
      <!-- 雲（speed が大きいほど速く流れる） -->
      <a-entity cloud="speed: 0.5" position="-50 9 -40" scale="1.6 1.6 1.6"></a-entity>
      <a-entity cloud="speed: 0.8" position="-20 13 -50" scale="1.2 1.2 1.2"></a-entity>
      <a-entity cloud="speed: 0.4" position="15 10 -45" scale="2 2 2"></a-entity>
      <a-entity cloud="speed: 0.7" position="45 14 -55" scale="1.4 1.4 1.4"></a-entity>
      <a-entity cloud="speed: 0.6" position="-35 7 -28" scale="1 1 1"></a-entity>
      <a-entity cloud="speed: 0.9" position="30 8 -30" scale="0.9 0.9 0.9"></a-entity>
      <a-entity cloud="speed: 0.5" position="0 16 -60" scale="1.8 1.8 1.8"></a-entity>
      
      <a-plane
        position="0 0 -5"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#7A4A21"
      ></a-plane>

<!-- 奥の穴 -->
      <a-circle position="-6.5 0.001 -10" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="-1.5 0.001 -8.2" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="3 0.001 -11" rotation="-90 0 0" radius="0.8" color="black"></a-circle>

      <!-- 真ん中の穴 -->
      <a-circle position="-5 0.001 -6" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="1.5 0.001 -5" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="6 0.001 -7" rotation="-90 0 0" radius="0.8" color="black"></a-circle>

      <!-- 手前の穴 -->
      <a-circle position="-3 0.001 -2.5" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="7.5 0.001 -13.5" rotation="-90 0 0" radius="0.8" color="black"></a-circle>
      <a-circle position="4 0.001 -3" rotation="-90 0 0" radius="0.8" color="black"></a-circle>

      <!-- 奥のモグラ -->
      <a-entity id="mole0" mogura position="-6.5 0.001 -10" visible="false"></a-entity>
      <a-entity id="mole1" mogura position="-1.5 0.001 -8.2" visible="false"></a-entity>
      <a-entity id="mole2" mogura position="3 0.001 -11" visible="false"></a-entity>

      <!-- 真ん中のモグラ -->
      <a-entity id="mole3" mogura position="-5 0.001 -6" visible="false"></a-entity>
      <a-entity id="mole4" mogura position="1.5 0.001 -5" visible="false"></a-entity>
      <a-entity id="mole5" mogura position="6 0.001 -7" visible="false"></a-entity>

      <!-- 手前のモグラ -->
      <a-entity id="mole6" mogura position="-3 0.001 -2.5" visible="false"></a-entity>
      <a-entity id="mole7" mogura position="7.5 0.001 -13.5" visible="false"></a-entity>
      <a-entity id="mole8" mogura position="4 0.001 -3" visible="false"></a-entity>

            <!-- 花（奥） -->
      <a-entity flower="color: #ff8fb1" position="-9.5 0 -15.5"></a-entity>
      <a-entity flower="color: #ffd54f" position="-3.5 0 -15.5"></a-entity>
      <a-entity flower="color: #ffffff" position="2.5 0 -15.5"></a-entity>
      <a-entity flower="color: #ce93d8" position="8.5 0 -15.5"></a-entity>

      <!-- 花（右） -->
      <a-entity flower="color: #ff7043" position="10.5 0 -10.5"></a-entity>
      <a-entity flower="color: #ff8fb1" position="10.5 0 -5.5"></a-entity>

      <!-- 花（手前） -->
      <a-entity flower="color: #ffffff" position="9 0 0"></a-entity>
      <a-entity flower="color: #ffd54f" position="3 0 0"></a-entity>
      <a-entity flower="color: #ce93d8" position="-3 0 0"></a-entity>
      <a-entity flower="color: #ff7043" position="-9 0 0"></a-entity>

      <!-- 花（左） -->
      <a-entity flower="color: #ff8fb1" position="-9.5 0 -5.5"></a-entity>
      <a-entity flower="color: #ffffff" position="-9.5 0 -10.5"></a-entity>

      <a-box
        id="startButton"
        class="clickable"
        position="0 1.8 -3.5"
        width="2.5"
        height="0.8"
        depth="0.2"
        color="#e53935"
      ></a-box>
      <a-text
        id="startText"
        value="START"
        position="0 1.8 -3.3"
        align="center"
        color="white"
        scale="2 2 2"
      ></a-text>

      <a-text
        id="timeUpText"
        value="TIME UP!"
        position="0 2.0 -3.5"
        align="center"
        color="#FF3D00"
        scale="4 4 4"
        visible="false"
      ></a-text>

      <a-text
        value="MOGURA TATAKI"
        position="0 6.5 -9"
        align="center"
        color="#FFFFFF"
        scale="8 8 8"
      ></a-text>
      <a-text
        id="time"
        value="TIME : 30"
        position="-2.5 3.5 -5"
        align="center"
        scale="3 3 3"
        color="#ffffff"
      ></a-text>
      <a-text
        id="score"
        value="SCORE : 0"
        position="2.5 3.5 -5"
        align="center"
        scale="3 3 3"
        color="#ffffff"
      ></a-text>

      <a-camera position="0 1.6 1.5"></a-camera>
    </a-scene>

    <div id="audioControls">
      <button
        id="audioToggle"
        type="button"
        aria-label="音量設定を表示"
        aria-controls="audioPanel"
        aria-expanded="false"
        title="音量設定"
      >
        ♪
      </button>
      <div id="audioPanel" hidden>
        <div class="audio-control">
          <label for="bgmVolume">BGM</label>
          <output id="bgmVolumeValue" for="bgmVolume">100%</output>
          <input id="bgmVolume" type="range" min="0" max="100" value="100" />
        </div>
        <div class="audio-control">
          <label for="seVolume">SE</label>
          <output id="seVolumeValue" for="seVolume">100%</output>
          <input id="seVolume" type="range" min="0" max="100" value="100" />
        </div>
      </div>
    </div>

    <script>
      //ゲーム全体の状態
      let time = 30;
      let score = 0;
      let timer;
      let game; //モグラ出現ループ用 setTimeout の ID
      let playing = false;

      //モグラの種類・タイミング設定
      const BAD_RATE = 0.2; //マイナスモグラが選ばれる確率
      const MIN_NORMAL_STREAK = 3; //次のマイナスを出すまでに最低限出す通常モグラの数
      const MAX_NORMAL_STREAK = 5; //この数まで通常が続いたら次は必ずマイナス
      const STAY_NORMAL = 1000; //通常モグラが顔を出している時間(ms)
      const STAY_BAD = 700; //マイナスモグラが顔を出している時間(ms)
      const STAY_GOLD = 600; //+3モグラが顔を出している時間(ms)。レアなので短め
      const GOLD_RATE = 0.3; //最低間隔を空けた後、+3モグラになる確率
      const MIN_GOLD_GAP = 3; //+3モグラの間に、最低限出す他のモグラの数
      const MAX_GOLD_GAP = 7; //この数まで+3が出なかったら、次は必ず+3モグラ
      const MAX_GOLD_AT_ONCE = 1; //+3モグラが同時に出られる最大数
      const MOVE_TIME = 150; //出入りのアニメーション時間(ms)
      const NORMAL_INTERVAL = 900; //前半の出現間隔(ms)
      const NORMAL_INTERVAL_SECOND = 600; //後半の出現間隔(ms)。小さいほど数が増える
      const SECOND_HALF_TIME = 15; //残りこの秒数以下を後半とする
      const BAD_INTERVAL = STAY_BAD + MOVE_TIME + 100;
      let normalSpawnStreak = 0; //マイナス出現後に続いた通常モグラの数
      let pendingBad = false; //マイナスを出すと決めて、出せる状態になるのを待っているか
      let sinceGold = 0; //最後の+3モグラの後に出た他のモグラの数

      //モグラの種類ごとの色
      const COLORS = {
        normal: { body: "#A66A3F", eye: "black" },
        bad: { body: "#8E24AA", eye: "black" },
        gold: { body: "#FFC107", eye: "black" },
      };

      //モグラの種類ごとの得点・叩いた時の色・顔を出している時間
      const POINTS = { normal: 1, bad: -1, gold: 3 };
      const HIT_FLASH = { normal: "#ff0000", bad: "#ffffff", gold: "#ffffff" };
      const STAY_TIME = { normal: STAY_NORMAL, bad: STAY_BAD, gold: STAY_GOLD };

      //叩いた時に浮かぶ得点表示（ここに無い種類は表示しない。通常にも出したい場合は normal を追加）
      const POPUP = {
        gold: { text: "+3", color: "#FFD600" },
        bad: { text: "-1", color: "#FF1744" },
      };
      const POPUP_TIME = 700; //得点表示が消えるまでの時間(ms)

      //穴ごとのモグラ・タイマー・状態
      const moles = [];
      const moleTimer = []; //自動で引っ込めるタイマー
      const hideTimer = []; //引っ込み後に非表示にするタイマー
      const moleState = new Array(9).fill(false); //穴を使用中か
      const moleHittable = new Array(9).fill(false); //叩ける状態か
      const moleRetracting = new Array(9).fill(false); //引っ込み中か
      const moleType = new Array(9).fill("normal"); //normal または bad

      //画面表示に使う要素
      const timeText = document.querySelector("#time");
      const scoreText = document.querySelector("#score");
      const startButton = document.querySelector("#startButton");
      const startText = document.querySelector("#startText");
      const timeUpText = document.querySelector("#timeUpText");

      //サウンド
      const startSound = new Audio("sound/popcorn.mp3");
      const moleSound = new Audio("sound/ニュッ2.mp3");
      const hitSound = new Audio("sound/ピコッ.mp3");
      const whistleSound = new Audio("sound/whistle.mp3");
      const audioToggle = document.querySelector("#audioToggle");
      const audioPanel = document.querySelector("#audioPanel");
      const bgmVolume = document.querySelector("#bgmVolume");
      const seVolume = document.querySelector("#seVolume");
      const bgmVolumeValue = document.querySelector("#bgmVolumeValue");
      const seVolumeValue = document.querySelector("#seVolumeValue");

      audioToggle.addEventListener("click", function () {
        const isExpanded = audioToggle.getAttribute("aria-expanded") === "true";
        audioPanel.hidden = isExpanded;
        audioToggle.setAttribute("aria-expanded", String(!isExpanded));
      });

      function updateAudioVolumes() {
        startSound.volume = Number(bgmVolume.value) / 100;
        const seLevel = Number(seVolume.value) / 100;
        moleSound.volume = seLevel;
        hitSound.volume = seLevel;
        whistleSound.volume = seLevel;
        bgmVolumeValue.value = bgmVolume.value + "%";
        seVolumeValue.value = seVolume.value + "%";
      }

      bgmVolume.addEventListener("input", updateAudioVolumes);
      seVolume.addEventListener("input", updateAudioVolumes);
      updateAudioVolumes();

      //初期化：9匹のモグラ要素を保持
      document.querySelector("a-scene").addEventListener("loaded", function () {
        for (let index = 0; index < 9; index++) {
          moles[index] = document.querySelector("#mole" + index);
        }
      });

      //モグラの種類に合わせて体と目の色を設定
      function applyLook(index, type) {
        const color = COLORS[type];
        moles[index]
          .querySelectorAll(".mole-body")
          .forEach((body) => body.setAttribute("color", color.body));

        const leftEye = moles[index].querySelector(".left-eye");
        const rightEye = moles[index].querySelector(".right-eye");

        leftEye.setAttribute("visible", true);
        rightEye.setAttribute("visible", true);

        leftEye.setAttribute("color", color.eye);
        rightEye.setAttribute("color", color.eye);

        moles[index].querySelectorAll(".hit-eye").forEach((eye) => {
          eye.setAttribute("visible", false);
        });

        if (type === "bad") {
          leftEye.setAttribute("rotation", "0 0 -25");
          rightEye.setAttribute("rotation", "0 0 25");

          leftEye.setAttribute("scale", "1.5 0.35 1");
          rightEye.setAttribute("scale", "1.5 0.35 1");
        } else {
          leftEye.setAttribute("rotation", "0 0 0");
          rightEye.setAttribute("rotation", "0 0 0");

          leftEye.setAttribute("scale", "1 1 1");
          rightEye.setAttribute("scale", "1 1 1");
        }
      }

      function occupiedCount() {
        return moleState.filter(Boolean).length;
      }

      //今出ている(引っ込み終わっていない)+3モグラの数
      function activeGoldCount() {
        let count = 0;
        for (let index = 0; index < moleState.length; index++) {
          if (moleState[index] && moleType[index] === "gold") {
            count++;
          }
        }
        return count;
      }

      //今の残り時間に合わせた、通常モグラの出現間隔
      function currentNormalInterval() {
        return time <= SECOND_HALF_TIME
          ? NORMAL_INTERVAL_SECOND
          : NORMAL_INTERVAL;
      }

      //次の出現を予約（出現ループは常に1本だけにする）
      function scheduleNext(delay) {
        clearTimeout(game);
        game = setTimeout(spawnTick, delay);
      }

      //次に出すモグラの種類を決めて出現させる
      function spawnTick() {
        if (!playing) {
          return;
        }

        //マイナスモグラの処理
        if (!pendingBad && normalSpawnStreak >= MIN_NORMAL_STREAK) {
          if (
            normalSpawnStreak >= MAX_NORMAL_STREAK ||
            Math.random() < BAD_RATE
          ) {
            pendingBad = true;
          }
        }

        if (pendingBad) {
          if (occupiedCount() > 0) {
            scheduleNext(50);
            return;
          }
          if (showMole("bad")) {
            pendingBad = false;
            normalSpawnStreak = 0;
            sinceGold++;
            scheduleNext(BAD_INTERVAL);
            return;
          }
        }

        //高得点モグラの処理
        const canGold =
          sinceGold >= MIN_GOLD_GAP && activeGoldCount() < MAX_GOLD_AT_ONCE;
        const wantGold =
          canGold && (sinceGold >= MAX_GOLD_GAP || Math.random() < GOLD_RATE);
        if (showMole(wantGold ? "gold" : "normal")) {
          normalSpawnStreak++;
          sinceGold = wantGold ? 0 : sinceGold + 1;
        }
        scheduleNext(currentNormalInterval());
      }

      //空いている穴をランダムに選んでモグラを1匹出す
      function showMole(type) {
        if (!playing) {
          return false;
        }

        const hidden = [];
        for (let index = 0; index < moles.length; index++) {
          if (!moleState[index]) {
            hidden.push(index);
          }
        }
        if (hidden.length === 0) {
          return false;
        }

        const index = hidden[Math.floor(Math.random() * hidden.length)];
        const position = moles[index].getAttribute("position");

        clearTimeout(moleTimer[index]);
        clearTimeout(hideTimer[index]);

        moleState[index] = true;
        moleHittable[index] = true;
        moleRetracting[index] = false;
        moleType[index] = type;

        applyLook(index, type);
        moles[index].setAttribute("visible", "true");
        moleSound.currentTime = 0;
        moleSound.play();

        moles[index].classList.add("clickable");
        moles[index]
          .querySelectorAll(".mole-body")
          .forEach((body) => body.classList.add("clickable"));

        moles[index].setAttribute(
          "animation",
          `property: position; to: ${position.x} 0 ${position.z}; dur: ${MOVE_TIME}`,
        );

        moleTimer[index] = setTimeout(
          () => retractMole(index),
          STAY_TIME[type],
        );
        return true;
      }

      //モグラを引っ込め、完全に隠れてから穴を空き状態に戻す
      function retractMole(index) {
        if (!moles[index] || !moleState[index] || moleRetracting[index]) {
          return;
        }

        moleRetracting[index] = true;
        moleHittable[index] = false;
        clearTimeout(moleTimer[index]);

        const position = moles[index].getAttribute("position");
        moles[index].classList.remove("clickable");
        moles[index]
          .querySelectorAll(".mole-body")
          .forEach((body) => body.classList.remove("clickable"));

        moles[index].setAttribute(
          "animation",
          `property: position; to: ${position.x} -1.5 ${position.z}; dur: ${MOVE_TIME}`,
        );

        clearTimeout(hideTimer[index]);
        hideTimer[index] = setTimeout(function () {
          moleState[index] = false;
          moleRetracting[index] = false;
          moles[index].setAttribute("visible", "false");
        }, MOVE_TIME);
      }

      //叩いた穴の上に得点を表示
      function showScorePopup(index, type) {
        const popup = POPUP[type];
        if (!popup) {
          return;
        }

        const position = moles[index].getAttribute("position");
        const label = document.createElement("a-text");
        label.setAttribute("value", popup.text);
        label.setAttribute("color", popup.color);
        label.setAttribute("align", "center");
        label.setAttribute("scale", "3 3 3");
        label.setAttribute("position", `${position.x} 1.9 ${position.z + 0.6}`);
        label.setAttribute(
          "animation__up",
          `property: position; to: ${position.x} 2.8 ${position.z + 0.6}; dur: ${POPUP_TIME}; easing: easeOutQuad`,
        );
        label.setAttribute(
          "animation__shrink",
          `property: scale; to: 0 0 0; dur: 250; delay: ${POPUP_TIME - 250}; easing: easeInQuad`,
        );
        document.querySelector("a-scene").appendChild(label);

        setTimeout(function () {
          if (label.parentNode) {
            label.parentNode.removeChild(label);
          }
        }, POPUP_TIME);
      }

      //モグラを叩いた時のスコア・色・引っ込み処理
      window.hitMole = function (index) {
        if (!playing || !moleState[index] || !moleHittable[index]) {
          return;
        }

        hitSound.currentTime = 0;
        hitSound.play();

        moleHittable[index] = false;
        clearTimeout(moleTimer[index]);

        const type = moleType[index];
        score += POINTS[type];
        scoreText.setAttribute("value", "SCORE : " + score);
        showScorePopup(index, type);

        const mole = moles[index];

        mole.querySelectorAll(".mole-eye").forEach((eye) => {
          eye.setAttribute("visible", false);
        });

        mole.querySelectorAll(".hit-eye").forEach((eye) => {
          eye.setAttribute("visible", true);
        });

        const flash = HIT_FLASH[type];
        moles[index]
          .querySelectorAll(".mole-body")
          .forEach((body) => body.setAttribute("color", flash));

        retractMole(index);
      };

      // スタートボタン：状態を初期化してゲームを開始
      startButton.addEventListener("click", function (event) {
        event.stopPropagation();
        if (playing) {
          return;
        }

        startSound.currentTime = 0;
        startSound.playbackRate = 1;
        startSound.play();

        playing = true;
        time = 30;
        score = 0;
        normalSpawnStreak = 0;
        pendingBad = false;
        sinceGold = 0;

        timeText.setAttribute("value", "TIME : " + time);
        scoreText.setAttribute("value", "SCORE : " + score);
        timeUpText.setAttribute("visible", false);
        startButton.setAttribute("visible", false);
        startButton.classList.remove("clickable");
        startText.setAttribute("visible", false);

        showMole("normal");

        // 残り時間を1秒ごとに更新
        timer = setInterval(function () {
          if (!playing) {
            return;
          }

          time--;
          timeText.setAttribute("value", "TIME : " + time);
          if (time <= 10) {
            startSound.playbackRate = 1.6;
          }

          if (time <= 0) {
            // 出現予約を止め、すべてのモグラを引っ込めてゲームを終了
            clearInterval(timer);
            clearTimeout(game);
            playing = false;
            pendingBad = false;
            startSound.pause();

            for (let index = 0; index < moles.length; index++) {
              clearTimeout(moleTimer[index]);
              retractMole(index);
            }

            // タイムアップ表示
            timeUpText.setAttribute("value", "TIME UP!");
            timeUpText.setAttribute("visible", true);
            whistleSound.currentTime = 0;
            whistleSound.play();
            // スタート画面に戻る
            setTimeout(function () {
              timeUpText.setAttribute("visible", false);
              startText.setAttribute("value", "START");
              startButton.setAttribute("visible", true);
              startButton.classList.add("clickable");
              startText.setAttribute("visible", true);
            }, 2500);
          }
        }, 1000);

        scheduleNext(NORMAL_INTERVAL);
      });

// ===== ボールを飛ばす共通処理 =====

const BALL_SPEED = 45;
const BALL_RADIUS = 0.25;


// ---------------------------------
// 共通：ボールを生成して飛ばす
// ---------------------------------
function shootBall(source, customDirection = null) {
  if (!playing) return;

  const scene = document.querySelector("a-scene");

  const sourceObject =
    source.getObject3D("camera") || source.object3D;

  const position = new THREE.Vector3();
  const direction = new THREE.Vector3();
  const rotation = new THREE.Quaternion();

  // 発射位置
  sourceObject.getWorldPosition(position);

  // 発射方向
  if (customDirection) {
    direction.copy(customDirection).normalize();
  } else {
    sourceObject.getWorldQuaternion(rotation);

    direction
      .set(0, 0, -1)
      .applyQuaternion(rotation)
      .normalize();
  }

  // 発射元の少し前から出す
  position.addScaledVector(direction, 0.8);

  // ボール生成
  const ball = document.createElement("a-sphere");

  ball.setAttribute("radius", BALL_RADIUS);
  ball.setAttribute(
    "material",
    "color: #ff0000; emissive: #660000"
  );

  scene.appendChild(ball);

  ball.object3D.position.copy(position);

  let previousTime = null;
  let elapsed = 0;


  // ---------------------------------
  // ボール移動
  // ---------------------------------
  function moveBall(timestamp) {
    if (!ball.parentNode) return;

    if (!playing) {
      ball.remove();
      return;
    }

    if (previousTime === null) {
      previousTime = timestamp;
    }

    const dt = Math.min(
      (timestamp - previousTime) / 1000,
      0.05
    );

    previousTime = timestamp;
    elapsed += dt;


    // 移動前の位置
    const oldPosition =
      ball.object3D.position.clone();


    // ボールを前へ移動
    ball.object3D.position.addScaledVector(
      direction,
      BALL_SPEED * dt
    );


    // ---------------------------------
    // モグラとの当たり判定
    // ---------------------------------

    const newPosition =
      ball.object3D.position.clone();

    const movement =
      newPosition.clone().sub(oldPosition);

    const movementLength =
      movement.length();

    if (movementLength > 0) {
      movement.normalize();

      const raycaster = new THREE.Raycaster();

      raycaster.set(
        oldPosition,
        movement
      );

      raycaster.far =
        movementLength + BALL_RADIUS;


      for (let i = 0; i < moles.length; i++) {

        if (!moleHittable[i]) continue;

        const meshes = [];

        moles[i]
          .querySelectorAll(".mole-body")
          .forEach((part) => {

            const mesh =
              part.getObject3D("mesh");

            if (mesh) {
              meshes.push(mesh);
            }
          });


        const hits =
          raycaster.intersectObjects(
            meshes,
            true
          );


        if (hits.length > 0) {

          console.log(
            "モグラ命中",
            i
          );

          window.hitMole(i);

          ball.remove();

          return;
        }
      }
    }


    // 3秒経ったら削除
    if (elapsed >= 3) {
      ball.remove();
      return;
    }

    requestAnimationFrame(moveBall);
  }

  requestAnimationFrame(moveBall);
}



// =================================
// PC・スマホ
// クリック / タップした方向に発射
// =================================

function shootFromScreen(clientX, clientY) {
  if (!playing) return;

  const cameraEl =
    document.querySelector("a-camera");

  const camera =
    cameraEl.getObject3D("camera");

  if (!camera) return;


  // 画面座標を -1 ～ 1 に変換
  const mouse =
    new THREE.Vector2();

  mouse.x =
    (clientX / window.innerWidth) * 2 - 1;

  mouse.y =
    -(clientY / window.innerHeight) * 2 + 1;


  // クリック位置の方向を取得
  const raycaster =
    new THREE.Raycaster();

  raycaster.setFromCamera(
    mouse,
    camera
  );


  const direction =
    raycaster.ray.direction.clone();


  shootBall(
    cameraEl,
    direction
  );
}



// =================================
// PC：クリック
// =================================

window.addEventListener(
  "click",
  function (event) {

    if (!playing) return;

    // 音量UIは除外
    if (
      event.target.closest("#audioControls")
    ) {
      return;
    }

    shootFromScreen(
      event.clientX,
      event.clientY
    );
  }
);



// =================================
// スマホ：タップ
// =================================

window.addEventListener(
  "touchstart",
  function (event) {

    if (!playing) return;

    // 音量UIを触った場合は除外
    if (
      event.target.closest("#audioControls")
    ) {
      return;
    }

    if (
      event.touches.length === 0
    ) {
      return;
    }

    const touch =
      event.touches[0];

    shootFromScreen(
      touch.clientX,
      touch.clientY
    );
  }
);



// =================================
// VR：右コントローラー
// =================================

const rightController =
  document.querySelector("#ctlR");

rightController.addEventListener(
  "triggerdown",
  function () {

    shootBall(
      rightController
    );

  }
);
